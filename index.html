<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>flick-n-fold</title>
</head>
<body>
  <div style="position: relative; width: fit-content;">
  <p id="finalResult"></p>
  <video id="webcam" autoplay playsinline style="transform: scaleX(-1);"></video>
  <canvas id="overlay" style="position: absolute; top: 0; left: 0; transform: scaleX(-1);"></canvas>
  <p id="status">Loading...</p>
  <p id="countdown">Waiting...</p>
  <p id="usermove"> </p>
  <p id="computermove"></p>
  <p id="playerPoints"></p>
  <p id="computerPoints"></p>
  <p id="roundResultDisplay"></p>
</div>
  <script type="module" src="script.js"></script>
</body>
</html>
